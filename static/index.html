<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiteHelioviewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css?v=0.9.3" />
  </head>
  <body>
    <aside class="panel" id="panel">
      <div class="brand">
        <div>
          <h1>LiteHelioviewer</h1>
          <p id="status">Ready</p>
        </div>
        <div class="brand-actions">
          <button id="resetView" title="Reset view">Reset</button>
          <button id="collapsePanel" title="Hide panel">&laquo;</button>
        </div>
      </div>

      <nav class="mode-switch" id="modeSwitch" aria-label="Panel mode">
        <button id="modeSingle" class="active" type="button">Single frame</button>
        <button id="modeSeries" type="button">Time series</button>
      </nav>

      <section class="section" id="singleSection">
        <h2>New layer</h2>
        <label>
          Server
          <select id="server"></select>
        </label>
        <label>
          Data
          <select id="preset"></select>
        </label>
        <label>
          UTC time
          <input id="date" type="datetime-local" step="1" />
        </label>
        <button id="addLayer" class="primary">Add Helioviewer layer</button>
        <div class="cache-row">
          <div id="cachePicker" class="cache-picker">
            <button id="cachePickerToggle" class="cache-picker-toggle" type="button" title="Previously downloaded frames">No cached frames</button>
            <div id="cachePickerMenu" class="cache-picker-menu" hidden></div>
          </div>
          <button id="loadCached" title="Load the selected frame from the local cache (no download)">Load cached</button>
        </div>
      </section>

      <section class="section" id="seriesBuilder" hidden>
        <h2>Time series</h2>
        <label>
          Start UTC
          <input id="seriesStart" type="datetime-local" step="1" />
        </label>
        <label>
          End UTC
          <input id="seriesEnd" type="datetime-local" step="1" />
        </label>
        <div class="cadence-field">
          <span class="cadence-title">Cadence</span>
          <div class="cadence-row">
            <input id="seriesCadenceNum" type="number" min="1" max="999" step="1" value="1" disabled />
            <select id="seriesCadenceUnit" title="Default = the finest cadence the selected data source itself offers">
              <option value="native" selected>Default (finest)</option>
              <option value="1">sec</option>
              <option value="60">min</option>
              <option value="3600">hour</option>
              <option value="86400">day</option>
            </select>
          </div>
        </div>
        <div class="series-stage">
          <label>
            Server
            <select id="seriesServer"></select>
          </label>
          <label>
            Data
            <select id="seriesPreset"></select>
          </label>
          <button id="seriesAddMember" type="button" title="Stage this layer for the series">+ Layer</button>
        </div>
        <div id="seriesMembers" class="series-members"></div>
        <button id="seriesCreate" class="primary" type="button" title="Start downloading the whole time series">Add timeseries</button>
      </section>

      <section class="section" id="seriesLibrary" hidden>
        <h2>Saved series</h2>
        <div id="seriesList" class="series-list"></div>
      </section>

      <section class="section row-actions">
        <button id="openFits">Open FITS</button>
        <button id="togglePfss">PFSS</button>
        <button id="cropMode">Crop</button>
        <button id="clearLayers">Clear</button>
        <input id="fitsInput" type="file" accept=".fits,.fit,.fts" hidden />
      </section>

      <section class="section view-toggles">
        <label class="view-toggle" title="Stonyhurst grid on the solar disk"><input id="toggleGrid" type="checkbox" checked /> Grid</label>
      </section>

      <section class="section layers-section">
        <h2>Layers</h2>
        <div id="layers" class="layers"></div>
      </section>

      <section class="section log-section">
        <div class="section-title-row">
          <h2>Log</h2>
          <button id="clearLog" title="Clear log">Clear</button>
        </div>
        <div id="logPanel" class="log-panel"></div>
      </section>
    </aside>

    <div id="panelSplitter" class="panel-splitter" title="Drag to resize panel"></div>
    <button id="expandPanel" class="panel-expand" title="Show panel" hidden>&raquo;</button>

    <main class="workspace" id="workspace">
      <div class="viewer" id="dropZone">
        <canvas id="sun"></canvas>
        <div class="hud">
          <span>Orthographic</span>
          <span id="viewReadout">lon 0.0 / lat 0.0</span>
        </div>
        <div id="coordReadout" class="coord-readout">Mouse: off disk</div>
        <div id="dlProgress" class="dl-progress" hidden>
          <span id="dlProgressLabel" class="dl-progress-label"></span>
          <span class="dl-progress-track"><span id="dlProgressBar" class="dl-progress-bar"></span></span>
          <span id="dlProgressText" class="dl-progress-text"></span>
        </div>
        <div id="seriesBar" class="series-bar" hidden>
          <div class="series-controls">
            <button id="seriesPlay" class="series-play" type="button" title="Play">▶</button>
            <button id="seriesStepPrev" class="series-step" type="button" title="Previous frame">‹</button>
            <button id="seriesStepNext" class="series-step" type="button" title="Next frame">›</button>
          </div>
          <span id="seriesBarName" class="series-bar-name" title=""></span>
          <input id="seriesScrub" type="range" min="0" max="0" step="1" value="0" />
          <span id="seriesBarTime" class="series-bar-time"></span>
          <span id="seriesBarCount" class="series-bar-count"></span>
          <select id="seriesFps" class="series-fps" title="Playback speed">
            <option value="1">1 fps</option>
            <option value="2">2 fps</option>
            <option value="5" selected>5 fps</option>
            <option value="10">10 fps</option>
            <option value="20">20 fps</option>
          </select>
        </div>
      </div>
      <button id="showCropDock" class="crop-show" hidden>Crops</button>

      <section id="cropDock" class="crop-dock" hidden>
        <div id="cropResize" class="crop-resize" title="Drag to resize crop window"></div>
        <div class="crop-head">
          <div id="cropTabs" class="crop-tabs"></div>
          <div class="crop-actions">
            <button id="toggleCropRegion" title="Hide/show the active crop region on the solar disk">Hide region</button>
            <button id="toggleCropCross" class="active" title="Hide/show the center crosshair on the crop image">Crosshair</button>
            <button id="resetCropView" title="Reset crop zoom and pan">Reset</button>
            <button id="hideCropDock" title="Collapse crop window">Collapse</button>
            <button id="clearCrops" title="Clear CEA crops">Clear</button>
          </div>
        </div>
        <div class="crop-body">
          <div class="crop-view">
            <canvas id="cropCanvas"></canvas>
            <div class="crop-export" id="cropExport">
              <button id="cropExportBtn" type="button" title="Export the crop image at original size, with drawn lines">Export</button>
              <div id="cropExportMenu" class="crop-export-menu" hidden>
                <button type="button" data-fmt="png">PNG</button>
                <button type="button" data-fmt="jpg">JPG</button>
                <button type="button" data-fmt="seq" id="cropExportSeq" hidden>PNG sequence (all frames)</button>
              </div>
            </div>
          </div>
          <div id="cropSideResize" class="crop-side-resize" title="Drag to resize side panel"></div>
          <aside class="crop-side">
            <div class="side-tabs">
              <button id="sideTabInfo" class="side-tab active" type="button">Info</button>
              <button id="sideTabAnalysis" class="side-tab" type="button">Analysis</button>
            </div>
            <div id="cropMeta" class="crop-meta"></div>
            <div id="analysisPanel" class="analysis-panel" hidden>
              <button id="addLineBtn" class="primary" type="button">+ Add line</button>
              <div id="lineSetup" class="line-setup" hidden>
                <label>
                  Layer
                  <select id="lineLayerSelect"></select>
                </label>
                <div class="line-setup-modes">
                  <button id="lineModeFreehand" type="button">Freehand</button>
                  <button id="lineModeBezier" type="button">Bezier</button>
                </div>
                <button id="lineSetupCancel" type="button">Cancel</button>
              </div>
              <div id="lineHint" class="line-hint" hidden>
                <span id="lineHintText"></span>
                <button id="lineHintDone" type="button" hidden>Done</button>
              </div>
              <div id="smoothPrompt" class="smooth-prompt" hidden>
                <span>Smooth this line?</span>
                <button id="smoothYes" type="button">Yes</button>
                <button id="smoothNo" type="button">No</button>
              </div>
              <div id="lineList" class="line-list"></div>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <script src="/static/app.js?v=0.9.3"></script>
  </body>
</html>
